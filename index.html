<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="WORDS — 10,000 词主动回忆与间隔重复记忆系统">
<title>WORDS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:#090a0d;color:#eef2f7}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center}
button,input{font:inherit}
button{cursor:pointer}
#app{width:100%;max-width:620px;min-height:100vh;padding-bottom:92px}
.hidden{display:none!important}
.topbar{height:68px;padding:17px 18px 9px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:18px;font-weight:780;letter-spacing:3px}
.brand span{color:#79a9ff}
.top-meta{display:flex;align-items:center;gap:8px}
.streak{font-size:12px;color:#a5adbc;background:#11141a;border:1px solid #252a34;padding:7px 12px;border-radius:999px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#39d98a;box-shadow:0 0 0 4px rgba(57,217,138,.08)}
.main{padding:0 15px}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:6px 2px 12px}
.eyebrow{font-size:11px;letter-spacing:1.2px;color:#697386;text-transform:uppercase}
.page-title{font-size:20px;margin:3px 0 0;font-weight:700}
.muted{font-size:12.5px;line-height:1.75;color:#7f899b}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 13px}
.plan-cell{background:#11141a;border:1px solid #242a34;border-radius:15px;padding:12px 13px}
.plan-cell .k{font-size:10.5px;color:#758093;margin-bottom:4px}
.plan-cell .v{font-size:20px;font-weight:740}
.plan-cell .v small{font-size:11px;color:#6f7889;font-weight:500;margin-left:4px}
.progress{margin:0 2px 12px}
.progress-head{display:flex;justify-content:space-between;font-size:11.5px;color:#7c8798;margin-bottom:6px}
.bar{height:6px;background:#171b22;border-radius:99px;overflow:hidden;border:1px solid #202530}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f8cff,#84aefe);border-radius:99px;transition:width .3s ease}
.card{background:#11141a;border:1px solid #272d37;border-radius:20px;padding:21px 19px 18px;box-shadow:0 14px 40px rgba(0,0,0,.24)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:10.5px;padding:4px 9px;border-radius:999px;background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.27);color:#8fb4ff}
.pill.dim{background:#181c23;border-color:#252a34;color:#798598}
.phonetic{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#747e90}
.word{font-size:35px;line-height:1.14;letter-spacing:.2px;font-weight:760;margin:3px 0 8px;word-break:break-word}
.pos{font-size:11.5px;color:#7e899b;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meaning{font-size:21px;line-height:1.55;font-weight:650;margin:8px 0 12px}
.meaning .sub{font-size:12px;color:#7f899b;font-weight:450;display:block;margin-top:4px}
.example{font-size:14.5px;line-height:1.85;color:#c1c8d4;background:#171b22;border:1px solid #242a34;border-radius:13px;padding:12px 13px;margin:11px 0;min-height:44px}
.example .blank{color:#88aeff;font-weight:700;letter-spacing:2px}
.source-note{font-size:10.5px;color:#646e80;margin-top:5px;display:block}
.input{width:100%;padding:14px 15px;border-radius:13px;background:#0d1015;border:1px solid #2b3240;color:#eff3f8;outline:none;margin-top:14px;transition:.18s}
.input:focus{border-color:#4f8cff;box-shadow:0 0 0 4px rgba(79,140,255,.1)}
.input::placeholder{color:#565f70}
.feedback{font-size:13.5px;line-height:1.7;margin-top:12px;min-height:0}
.feedback.ok{color:#53e0a0}
.feedback.bad{color:#ff8383}
.feedback strong{color:#eaf1ff}
.actions{display:flex;gap:9px;margin-top:14px}
.btn{flex:1;border:none;border-radius:12px;padding:12px 14px;font-weight:650;font-size:14px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:#4f8cff;color:#fff;box-shadow:0 7px 20px rgba(79,140,255,.2)}
.btn.ghost{background:#181c23;color:#bcc4d1;border:1px solid #282e39}
.btn.flat{flex:0 0 auto;background:transparent;color:#8ba9e6;padding:7px 6px;font-size:12.5px}
.btn.danger{background:rgba(247,111,111,.11);color:#ff8686;border:1px solid rgba(247,111,111,.27)}
.answer-tools{display:flex;justify-content:flex-end;gap:4px;margin-top:5px}
.finish{background:#11141a;border:1px solid #272d37;border-radius:20px;padding:44px 22px;text-align:center}
.finish .icon{font-size:38px;margin-bottom:10px;color:#53e0a0}
.finish h2{font-size:21px;margin:4px 0 7px}
.finish p{margin:0;color:#808a9a;line-height:1.7;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:#11141a;border:1px solid #252b35;border-radius:15px;padding:15px}
.stat .k{font-size:10.5px;color:#737e90}
.stat .v{font-size:25px;font-weight:760;margin-top:5px}
.stat .v small{font-size:11px;color:#6c7687;font-weight:500;margin-left:4px}
.panel{background:#11141a;border:1px solid #252b35;border-radius:17px;padding:15px;margin-top:10px}
.panel-title{font-size:13.5px;font-weight:680;margin-bottom:9px}
.dist{display:flex;align-items:center;gap:8px;margin:8px 0}
.dist .lab{width:62px;font-size:10.5px;color:#7c8798}
.dist .track{flex:1;height:7px;border-radius:99px;background:#181c23;overflow:hidden}
.dist .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f8cff,#83aaff)}
.dist .num{width:46px;text-align:right;font-size:10.5px;color:#727d90}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day{background:#181c23;border:1px solid #252b35;border-radius:10px;padding:8px 0;text-align:center}
.day .d{font-size:9.5px;color:#737e90}
.day .v{font-size:12px;margin-top:4px;color:#475061}
.day.on{background:rgba(57,217,138,.08);border-color:rgba(57,217,138,.28)}
.day.on .v{color:#53e0a0}
.weak-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #1f242d}
.weak-row:first-of-type{border-top:none}
.weak-word{font-size:13.5px;font-weight:650}
.weak-meta{font-size:10.5px;color:#717b8d}
.choice-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.choice{padding:10px 4px;border-radius:10px;background:#171b22;border:1px solid #282e39;color:#8993a5;font-size:11.5px}
.choice.on{background:#4f8cff;border-color:#4f8cff;color:#fff}
.range-row{display:flex;gap:10px;align-items:center}
.range{flex:1;accent-color:#4f8cff}
.range-val{width:62px;text-align:right;color:#8fb4ff;font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
.switch{appearance:none;width:42px;height:24px;border-radius:999px;background:#262c35;position:relative;outline:none;border:none}
.switch:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#8a93a3;transition:.18s}
.switch:checked{background:#4f8cff}
.switch:checked:before{left:21px;background:#fff}
.source-box{background:#0d1015;border:1px solid #222832;border-radius:12px;padding:11px 12px;color:#727c8d;font-size:11px;line-height:1.7}
.tabbar{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;background:rgba(11,13,17,.95);backdrop-filter:blur(14px);border-top:1px solid #242a34;padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex}
.tab{flex:1;background:none;border:none;color:#60697a;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.tab span{font-size:17px;line-height:1}
.tab em{font-style:normal}
.tab.active{color:#4f8cff}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,14px);background:#212632;color:#eef2f7;border:1px solid #303743;padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.error-box{position:fixed;left:12px;right:12px;top:12px;z-index:90;background:#3a1517;border:1px solid #6c282d;color:#ffc3c6;padding:11px 13px;border-radius:12px;font-size:11.5px;line-height:1.5;white-space:pre-wrap}
.empty{text-align:center;padding:50px 18px;color:#727c8d}
.tiny{font-size:10.5px;color:#697386;line-height:1.65}
.kbd{display:inline-block;border:1px solid #2c333f;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:10px;color:#8d97a8;background:#161a21}
@media(max-width:420px){.choice-grid{grid-template-columns:repeat(3,1fr)}.word{font-size:31px}.meaning{font-size:20px}}
</style>
</head>

  $('study-card').innerHTML='<div class="card"><div class="card-top"><div class="pills">'+
     '<span class="pill">'+phLabel+'</span><span class="pill dim">记忆难度 Lv.'+lv+'</span><span class="pill dim">基点 Lv.'+d.baseLv+'</span>'+
     '</div><button class="btn flat" id="audioBtn" type="button">听发音</button></div>'+
     '<div class="word">'+escapeHtml(d.w)+'</div>'+
     '<div class="pos"><span>'+escapeHtml(posCN(d.pos))+'</span><span class="phonetic" id="phonEl">'+escapeHtml(phon)+'</span><span class="phonetic">'+(session.done+1)+' / '+session.total+'</span></div>'+
     body+
     '<div class="answer-tools"><button class="btn flat" id="hintBtn" type="button">提示</button></div>'+
     '<div id="feedback" class="feedback"></div>'+
     '<div class="actions"><button class="btn ghost" id="failBtn" type="button">忘记</button>'+
     '<button class="btn primary" id="submitBtn" type="button">提交</button>'+
     '<button class="btn primary hidden" id="nextBtn" type="button">继续</button></div></div>';
  $('audioBtn').onclick=function(){speak(d.w)};
  $('hintBtn').onclick=hint;
  $('failBtn').onclick=function(){submit(true)};
  $('submitBtn').onclick=function(){submit(false)};
  $('nextBtn').onclick=next;
  qStart=performance.now();phase='question';
  var input=$('answer');if(input){input.focus();input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submit(false)}})}
  if(state.settings.autoSpeak)setTimeout(function(){if(seq===renderSeq)speak(d.w)},100);
  /* enrich phonetics + example asynchronously */
  dictInfo(d.w).then(function(info){
    if(seq!==renderSeq)return;
    if(info.phonetic){var pe=$('phonEl');if(pe)pe.textContent='/'+info.phonetic.replace(/^\/|\/$/g,'')+'/'}
    var box=$('exampleBox');
    if(box){box.innerHTML=info.example?cloze(info.example,d.w):'<span class="source-note">没有可用的例句，请根据中文含义写出单词。</span>'}
  }).catch(function(){var box=$('exampleBox');if(box&&seq===renderSeq)box.innerHTML='<span class="source-note">没有可用的例句，请根据中文含义写出单词。</span>'});
}
function cloze(s,w){var re=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','ig');return escapeHtml(s).replace(re,'<span class="blank">______</span>')}

/* ---------- dictionary / speech ---------- */
function dictInfo(w){
  if(dictCache[w])return Promise.resolve(dictCache[w]);
  var ctrl=null,timer=null;
  try{ctrl=new AbortController();timer=setTimeout(function(){try{ctrl.abort()}catch(e){}},6000)}catch(e){}
  function done(o){if(timer)clearTimeout(timer);dictCache[w]=o;return o}
  return fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w),ctrl?{signal:ctrl.signal}:undefined)
   .then(function(r){if(!r.ok)throw new Error('nf');return r.json()})
   .then(function(j){
     var e=j&&j[0]||{},phonetics=e.phonetics||[];
     var p=phonetics.filter(function(x){return /uk|gb|brit/i.test(x.text||'')})[0]||phonetics.filter(function(x){return x.audio})[0]||phonetics[0]||{};
     var ex='';(e.meanings||[]).some(function(m){return (m.definitions||[]).some(function(df){if(df.example){ex=df.example;return true}return false})});
     return done({phonetic:p.text||'',audio:p.audio||'',example:ex});
   })
   .catch(function(){return done({phonetic:'',audio:'',example:''})});
}
function speak(w){
  var done=false;
  function say(){
    if(done)return;done=true;
    if(window.speechSynthesis){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=state.settings.speechRate;speechSynthesis.speak(u)}
  }
  var t=setTimeout(say,1200);
  dictInfo(w).then(function(info){
    if(done)return;clearTimeout(t);
    if(info.audio){
      done=true;try{var a=new Audio(info.audio),pr=a.play();if(pr&&pr.catch)pr.catch(function(){done=false;say()});return}catch(e){done=false}
    }
    say();
  });
}
function hint(){
  var d=currentData();if(!d||!session||phase!=='question')return;
  var r=currentRec(),item=session.queue[0];r.hints=(r.hints||0)+1;save();
  var fb=$('feedback');fb.className='feedback';
  if(item.stage==='meaning'){fb.innerHTML='提示：'+escapeHtml(d.zh.split(/[；;，,、/|]/)[0]||'先回忆最常见义项。')}
  else{fb.innerHTML='提示：<strong>'+escapeHtml(d.w[0])+'</strong> 开头，共 '+d.w.length+' 个字母。'}
}

/* ---------- answering ---------- */
function normZh(s){return String(s||'').toLowerCase().replace(/[\s，。,；;、/|“”"'()（）\[\]{}·…]/g,'')}
function checkMeaning(input,expected){
  var a=normZh(input);if(a.length<2)return false;
  var parts=expected.split(/[；;，,、/|]/).map(normZh).filter(function(x){return x.length>=1});
  return parts.some(function(p){return p&&(a===p||a.indexOf(p)>=0||p.indexOf(a)>=0)});
}
function checkSpelling(input,word){return String(input||'').toLowerCase().replace(/[\s'’-]/g,'')===word.toLowerCase()}
function submit(force){
  if(!session||!session.queue.length||phase!=='question')return;
  var item=session.queue[0],d=MAP[item.w],r=userRec(item.w);
  var val=force?'':(($('answer')&&$('answer').value)||'').trim();
  if(!force&&!val){$('answer').focus();return}
  var elapsed=Math.max(0,performance.now()-qStart);
  r.seen=(r.seen||0)+1;if(r.seen===1)r.introduced=today();r.responseMs=(r.responseMs||0)+elapsed;state.totalAnswers++;state.totalSeconds+=elapsed/1000;
  var askedStage=item.stage;
  var ok=!force&&(askedStage==='meaning'?checkMeaning(val,d.zh):checkSpelling(val,d.w));
  if(ok){
    state.totalCorrect++;session.correct++;r.correct=(r.correct||0)+1;r.streak=(r.streak||0)+1;
    if(askedStage==='meaning'&&item.mode==='new'){
      r.meaningCorrect=(r.meaningCorrect||0)+1;
      r.dueAt=Date.now()+EBB[0];               /* keep it out of "due" until the second phase is done */
      item.stage='production';                 /* same word, second active recall, shown immediately */
    }else{
      if(askedStage==='meaning')r.meaningCorrect=(r.meaningCorrect||0)+1;else r.productionCorrect=(r.productionCorrect||0)+1;
      r.stage=Math.min(MAX_STAGE,(r.stage||0)+1);
      r.dueAt=Date.now()+EBB[r.stage];
      session.queue.shift();session.done++;markDay(true);
    }
  }else{
    session.wrong++;r.streak=0;
    if(askedStage==='meaning')r.meaningWrong=(r.meaningWrong||0)+1;else r.productionWrong=(r.productionWrong||0)+1;
    r.stage=Math.max(0,(r.stage||0)-1);
    r.dueAt=Date.now()+EBB[0];
    session.queue.push(session.queue.shift()); /* requeue same prompt */
  }
  save();showFeedback(ok,d,askedStage,item.mode);
}
function showFeedback(ok,d,askedStage,mode){
  phase='feedback';
  var ans=$('answer');if(ans)ans.disabled=true;
  var s=$('submitBtn'),f=$('failBtn'),h=$('hintBtn'),n=$('nextBtn');
  if(s)s.classList.add('hidden');if(f)f.classList.add('hidden');if(h)h.classList.add('hidden');if(n)n.classList.remove('hidden');
  var fb=$('feedback');fb.className='feedback '+(ok?'ok':'bad');
  if(askedStage==='meaning'){
    fb.innerHTML=ok?'✓ 核心词义正确。下一步进入语境产出。':'✗ 先记住核心义项：<strong>'+escapeHtml(d.zh)+'</strong>';
  }else{
    fb.innerHTML=ok?'✓ 语境产出正确，记忆阶段已上升。':'✗ 正确答案：<strong>'+escapeHtml(d.w)+'</strong>　'+escapeHtml(d.zh);
  }
  if(n)n.focus();
}
var lastNext=0;
function next(){var now=Date.now();if(now-lastNext<200)return;lastNext=now;if(!session)return;if(!session.queue.length){finish();return}renderCard()}

/* ---------- day / streak ---------- */
function markDay(ok){
  var t=today();if(!state.days[t])state.days[t]={answers:0,correct:0,done:false};
  state.days[t].answers++;if(ok)state.days[t].correct++;
  if(state.days[t].correct>=5){state.days[t].done=true;updateStreak()}
}
function updateStreak(){var t=today(),s=state.streak;if(s.last===t)return;if(s.last&&addDays(s.last,1)===t)s.count++;else s.count=1;s.last=t}
function finish(){
  var done=session?session.done:0,tot=session?session.total:0,cor=session?session.correct:0;
  session=null;phase='question';save();renderStudy();
  var c=$('study-card');if(!c)return;
  c.innerHTML='<div class="finish"><div class="icon">✓</div><h2>本轮完成</h2><p>完成 '+done+' / '+tot+' 个完整记忆闭环，本轮正确 '+cor+' 次。到期复习永远优先于新词。</p>'+
   '<div class="actions"><button class="btn ghost" id="extraBtn" type="button">再学一组</button><button class="btn primary" id="statsBtn" type="button">统计</button></div></div>';
  $('extraBtn').onclick=function(){start(true)};$('statsBtn').onclick=function(){showView('stats')};
}

/* ---------- views ---------- */
function showView(n){
  document.querySelectorAll('.view').forEach(function(x){x.classList.add('hidden')});
  var v=$('view-'+n);if(v)v.classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.view===n)});
  if(n==='stats')renderStats();
  if(n==='settings')renderSettings();
  window.scrollTo(0,0);
}
function accuracy(){return state.totalAnswers?Math.round(state.totalCorrect/state.totalAnswers*100):0}
function renderStats(){
  var learned=0;
  var due=getDue().length;
  var stageDist=new Array(MAX_STAGE+1).fill(0);
  var diffDist=new Array(11).fill(0);
  var weak=[],lvSum=0;
  Object.keys(state.words).forEach(function(w){
    var r=state.words[w],d=MAP[w];if(!d)return;
    if(!(r.seen>0))return;
    learned++;
    var st=Math.min(MAX_STAGE,r.stage||0);stageDist[st]++;
    var lv=personalLevel(d,r);diffDist[lv]++;lvSum+=lv;
    var wrong=(r.meaningWrong||0)+(r.productionWrong||0);
    if(wrong){weak.push({w:w,wrong:wrong,lv:lv})}
  });
  weak.sort(function(a,b){return b.wrong-a.wrong});
  var avgLv=learned?Math.round(lvSum/learned*10)/10:0;
  var t=today(),week='';
  for(var i=6;i>=0;i--){var ds=addDays(t,-i),rd=state.days[ds],on=rd&&rd.done;
    week+='<div class="day '+(on?'on':'')+'"><div class="d">'+ds.slice(5)+'</div><div class="v">'+(on?'✓':(rd?rd.correct:'·'))+'</div></div>'}
  var mx=Math.max.apply(null,[1].concat(stageDist)),bars='';
  stageDist.forEach(function(n,i){bars+='<div class="dist"><span class="lab">'+STAGE_LABELS[i]+'</span><span class="track"><i style="width:'+(n/mx*100)+'%"></i></span><span class="num">'+n+'</span></div>'});
  var dmx=Math.max.apply(null,[1].concat(diffDist.slice(1,11))),dbars='';
  for(var L=1;L<=10;L++){dbars+='<div class="dist"><span class="lab">Lv.'+L+'</span><span class="track"><i style="width:'+(diffDist[L]/dmx*100)+'%"></i></span><span class="num">'+diffDist[L]+'</span></div>'}
  var weakHtml=weak.slice(0,8).map(function(x){return '<div class="weak-row"><div><div class="weak-word">'+escapeHtml(x.w)+'</div><div class="weak-meta">记忆难度 Lv.'+x.lv+'</div></div><div class="weak-meta">错 '+x.wrong+' 次</div></div>'}).join('')||'<div class="tiny">暂时没有高频错词。</div>';
  $('view-stats').innerHTML=
   '<div class="section-head"><div><div class="eyebrow">MEMORY PROFILE</div><h1 class="page-title">统计</h1></div><div class="tiny">基点难度自动分级 1–10</div></div>'+
   '<div class="grid2"><div class="stat"><div class="k">连续打卡</div><div class="v">'+(state.streak.count||0)+'<small>天</small></div></div>'+
   '<div class="stat"><div class="k">已进入记忆库</div><div class="v">'+learned.toLocaleString()+'<small>词</small></div></div>'+
   '<div class="stat"><div class="k">总正确率</div><div class="v">'+accuracy()+'<small>%</small></div></div>'+
   '<div class="stat"><div class="k">待复习</div><div class="v">'+due.toLocaleString()+'<small>词</small></div></div></div>'+
   '<div class="panel"><div class="panel-title">最近 7 天</div><div class="week">'+week+'</div></div>'+
   '<div class="panel"><div class="panel-title">记忆阶段分布</div><div class="tiny">阶段越高，下一次复习间隔越长；答错会回落到 10 分钟强化。</div>'+bars+'</div>'+
   '<div class="panel"><div class="panel-title">个人记忆难度</div><div class="tiny">当前平均 Lv.'+avgLv+'，由词库基点叠加你的错误、提示与连续正确动态修正。</div>'+dbars+'</div>'+
   '<div class="panel"><div class="panel-title">高频错误词</div>'+weakHtml+'</div>';
}
function renderSettings(){
  var s=state.settings;
  var choices=[['adaptive','自适应'],['easy','基础'],['mid','进阶'],['hard','困难'],['extreme','挑战']];
  $('view-settings').innerHTML=
   '<div class="section-head"><div><div class="eyebrow">SYSTEM</div><h1 class="page-title">设置</h1></div></div>'+
   '<div class="panel"><div class="panel-title">新词记忆难度</div><p class="muted">难度依据词频与考试等级自动分级为 1–10 的<b>基点难度</b>，再叠加你的错误次数、提示次数、连续正确与记忆阶段，得到<b>个人记忆难度</b>。不按首字母或数组顺序选词。</p>'+
   '<div class="choice-grid">'+choices.map(function(c){return '<button class="choice '+(s.difficulty===c[0]?'on':'')+'" data-diff="'+c[0]+'" type="button">'+c[1]+'</button>'}).join('')+'</div></div>'+
   '<div class="panel"><div class="panel-title">每日新词</div><div class="range-row"><input id="dailyRange" class="range" type="range" min="20" max="300" step="10" value="'+s.dailyNew+'"><div id="dailyVal" class="range-val">'+s.dailyNew+' 词</div></div>'+
   '<div class="tiny">默认 300 词。每个新词包含“英译汉 + 语境汉译英”两次主动回忆。</div></div>'+
   '<div class="panel"><div class="panel-title">每日复习上限</div><div class="range-row"><input id="reviewRange" class="range" type="range" min="50" max="600" step="25" value="'+s.reviewLimit+'"><div id="reviewVal" class="range-val">'+s.reviewLimit+' 词</div></div>'+
   '<div class="tiny">到期复习永远优先于新词。</div></div>'+
   '<div class="panel"><div class="panel-title">发音</div><div class="toggle"><span>自动朗读当前单词</span><input id="autoSpeak" class="switch" type="checkbox" '+(s.autoSpeak?'checked':'')+'></div>'+
   '<div class="range-row"><span class="tiny">语速</span><input id="rateRange" class="range" type="range" min="0.65" max="1.15" step="0.05" value="'+s.speechRate+'"><div id="rateVal" class="range-val">'+Number(s.speechRate).toFixed(2)+'</div></div>'+
   '<div class="tiny">优先使用在线词典的英式音频，不可用时回退到浏览器英式语音。</div></div>'+
   '<div class="panel"><div class="panel-title">数据管理</div><div class="actions"><button class="btn ghost" id="exportBtn" type="button">导出</button><button class="btn ghost" id="importBtn" type="button">导入</button><button class="btn danger" id="resetBtn" type="button">重置</button></div><input id="fileInput" type="file" accept="application/json,.json" class="hidden">'+
   '<div class="tiny" style="margin-top:8px">快捷键：<span class="kbd">Enter</span> 提交 / 继续。</div></div>'+
   '<div class="panel"><div class="panel-title">词库来源</div><div class="source-box">本地内置 <b>'+WORDS.length.toLocaleString()+'</b> 个核心词条，离线可用。释义与音标来自开源 ECDICT；难度 1–10 由 BNC/COCA 词频与考试等级（中考 / 高考 / CET / 考研 / TOEFL / IELTS / GRE）自动分级；例句与英式音频联网时来自 dictionaryapi.dev。</div></div>';
  document.querySelectorAll('[data-diff]').forEach(function(b){b.onclick=function(){state.settings.difficulty=b.dataset.diff;save();renderSettings();toast('难度范围：'+modeLabel())}});
  $('dailyRange').oninput=function(e){state.settings.dailyNew=+e.target.value;$('dailyVal').textContent=e.target.value+' 词';save()};
  $('reviewRange').oninput=function(e){state.settings.reviewLimit=+e.target.value;$('reviewVal').textContent=e.target.value+' 词';save()};
  $('autoSpeak').onchange=function(e){state.settings.autoSpeak=e.target.checked;save()};
  $('rateRange').oninput=function(e){state.settings.speechRate=+e.target.value;$('rateVal').textContent=Number(e.target.value).toFixed(2);save()};
  $('exportBtn').onclick=exportData;$('importBtn').onclick=function(){$('fileInput').click()};$('fileInput').onchange=importData;$('resetBtn').onclick=resetData;
}
function exportData(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='words-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('备份已导出')}
function importData(e){var f=e.target.files&&e.target.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{state=normalize(JSON.parse(fr.result));save();session=null;renderAll();toast('备份导入成功')}catch(err){toast('文件格式错误')}};fr.readAsText(f);e.target.value=''}
function resetData(){if(!confirm('确定清空全部学习记录？内置词库不会删除。'))return;state=JSON.parse(JSON.stringify(DEFAULT));save();session=null;renderAll();toast('学习记录已清空')}
function renderStreak(){$('streakEl').textContent='连续 '+(state.streak.count||0)+' 天'}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(!session)return;
  if(phase==='feedback'){e.preventDefault();next()}
});

/* ---------- boot ---------- */
function renderAll(){renderStreak();showView('study');if(!session)start(false)}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){showView(b.dataset.view)}});
function boot(){
  try{
    if(!WORDS.length)throw new Error('词库为空');
    MAP={};WORDS.forEach(function(d){MAP[d.w]=d});
    renderStreak();
    start(false);
    toast('词库已就绪 · '+WORDS.length.toLocaleString()+' 词');
  }catch(e){showError(e)}
}
boot();
})();
</script>
