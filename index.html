<script>
(function(){'use strict';
const DATA_URLS=[
 'https://raw.githubusercontent.com/britishcouncil/bea2026st/main/data/train/cn/kvl_shared_task_cn_train.csv',
 'https://raw.githubusercontent.com/britishcouncil/bea2026st/main/data/dev/cn/kvl_shared_task_cn_dev.csv',
 'https://raw.githubusercontent.com/britishcouncil/bea2026st/main/data/test/cn/kvl_shared_task_cn_test.csv'
];
const EBBINGHAUS=[10*60*1000,1*864e5,2*864e5,4*864e5,7*864e5,15*864e5,30*864e5,60*864e5,120*864e5,240*864e5,365*864e5];
const MAX_STAGE=EBBINGHAUS.length-1;
const STORE='words_v4'; const OLD='ielts_words_v1';
const DEFAULT={settings:{dailyNew:300,reviewLimit:300,difficulty:'adaptive',speechRate:.92,autoSpeak:true},words:{},days:{},streak:{count:0,last:null},totalAnswers:0,totalCorrect:0,totalSeconds:0};
let state=load(); let WORDS=[]; let MAP={}; let session=null; let phase='question'; let questionStarted=0; let lastQueueKey=''; let remoteReady=false; let audioCache={};
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function today(){const d=new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}).format(d)}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function load(){try{const r=localStorage.getItem(STORE);if(r)return normalize(JSON.parse(r));const old=localStorage.getItem(OLD);if(old){const o=JSON.parse(old), n=normalize({settings:o.settings,words:o.words,days:o.days,streak:o.streak,totalAnswers:o.totalAnswers,totalCorrect:o.totalCorrect});return n}}catch(e){} return JSON.parse(JSON.stringify(DEFAULT))}
function normalize(o){return {settings:Object.assign({},DEFAULT.settings,o.settings||{}),words:o.words||{},days:o.days||{},streak:Object.assign({},DEFAULT.streak,o.streak||{}),totalAnswers:+o.totalAnswers||0,totalCorrect:+o.totalCorrect||0,totalSeconds:+o.totalSeconds||0}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function toast(s){const x=$('toast');x.textContent=s;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),1800)}
function showError(e){const box=$('errorBox');box.textContent='脚本错误：'+(e&&e.message?e.message:e);box.classList.remove('hidden')}
window.addEventListener('error',e=>showError(e.error||e.message));
function splitCsv(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
function parseCsv(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);const rows=[];for(let i=1;i<lines.length;i++){if(!lines[i].trim())continue;const p=splitCsv(lines[i]);if(p.length>=8)rows.push(p)}return rows}
function toLevel(score){if(typeof score!=='number'||!isFinite(score))return 5;const z=Math.max(-5,Math.min(5,score));return Math.max(1,Math.min(10,Math.round(6.1-z*0.82)))}
function makeWord(word,pos,zh,score,context,clue){const w=word.toLowerCase().trim();return {w,pos:pos||'',zh:(zh||'').trim(),score:Number(score),context:(context||'').trim(),clue:(clue||'').trim(),baseLv:toLevel(Number(score))}}
async function loadRemote(){
  const status=$('dataStatus');
  try{
    const texts=await Promise.all(DATA_URLS.map(u=>fetch(u,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('词库下载失败');return r.text()})));
    const byWord=new Map();
    texts.flatMap(parseCsv).forEach(p=>{const d=makeWord(p[2],p[3],p[5],parseFloat(p[7]),p[6],p[4]);if(!d.w||d.w.length<2)return;const prev=byWord.get(d.w);if(!prev||d.score<prev.score||d.zh.length>prev.zh.length)byWord.set(d.w,d)});
    WORDS=Array.from(byWord.values());
    WORDS.forEach(w=>{w.key=w.w;MAP[w.w]=w});
    remoteReady=true;status.classList.add('ready');toast('研究词库已载入 · '+WORDS.length.toLocaleString()+' 词');renderAll();
  }catch(e){
    WORDS=window.SEED_WORDS.map(a=>({w:a[0],zh:a[1],pos:a[2],baseLv:a[3],score:null,context:'',clue:a[0][0]+'_'+ '_'.repeat(Math.max(1,a[0].length-1)),key:a[0]}));WORDS.forEach(w=>MAP[w.w]=w);status.classList.add('ready');renderAll();toast('使用离线词库 · '+WORDS.length+' 词');
  }
}
function userRec(w){let r=state.words[w];if(!r){r={stage:0,dueAt:Date.now(),introduced:null,meaningCorrect:0,productionCorrect:0,meaningWrong:0,productionWrong:0,hints:0,seen:0,correct:0,responseMs:0,streak:0};state.words[w]=r}return r}
function personalLevel(d,r){r=r||{};let lv=d.baseLv||5;const wrong=(r.meaningWrong||0)+(r.productionWrong||0);const cor=r.streak||0;lv += Math.min(2.3,wrong*.36);lv -= Math.min(1.2,cor*.18);if(r.hints)lv += Math.min(1.0,r.hints*.05);return Math.max(1,Math.min(10,Math.round(lv)))}
function modeLabel(){const m=state.settings.difficulty;return m==='adaptive'?'自适应':m==='easy'?'基础':'进阶';}
function allowNew(d){const m=state.settings.difficulty;if(m==='adaptive')return true;if(m==='easy')return d.baseLv<=3;if(m==='mid')return d.baseLv>=4&&d.baseLv<=6;if(m==='hard')return d.baseLv>=7&&d.baseLv<=8;if(m==='extreme')return d.baseLv>=9;return true}
function priority(d){const r=state.words[d.w];const p=personalLevel(d,r);const rec=r?((r.productionWrong||0)*2+(r.meaningWrong||0)+(r.hints||0)*.35):0;const stage=r?r.stage:0;return (10-p)*0.5+rec+stage*.06+Math.random()*.5}
function getDue(){const t=Date.now();return Object.keys(state.words).filter(w=>MAP[w]&&state.words[w].dueAt<=t).map(w=>({w,score:(state.words[w].dueAt||0)})).sort((a,b)=>a.score-b.score).map(x=>x.w)}
function getNewQuota(extra){const t=today();let introduced=0;Object.values(state.words).forEach(r=>{if(r.introduced===t)introduced++});return extra?state.settings.dailyNew:Math.max(0,state.settings.dailyNew-introduced)}
function pickNew(n){const pool=WORDS.filter(d=>!state.words[d.w]&&allowNew(d));const sorted=pool.map(d=>({d,s:priority(d)})).sort((a,b)=>a.s-b.s);return sorted.slice(0,n).map(x=>x.d.w)}
function makeQueue(extra){const due=getDue().slice(0,state.settings.reviewLimit);const fresh=pickNew(getNewQuota(extra));const q=[];due.forEach(w=>q.push({w,mode:'review',stage:'meaning'}));fresh.forEach(w=>{const r=userRec(w);r.introduced=today();r.dueAt=Date.now();q.push({w,mode:'new',stage:'meaning'})});return q}
function start(extra=false){if(session){toast('当前学习还没有完成');return}const q=makeQueue(extra);save();if(!q.length){renderStudyEmpty();return}session={queue:q,done:0,total:q.length,sessionCorrect:0,sessionWrong:0};phase='question';renderStudy();renderCard()}
function renderStudy(){const due=getDue().length;let introduced=0;const t=today();Object.values(state.words).forEach(r=>{if(r.introduced===t)introduced++});const p=state.settings.dailyNew?Math.min(100,introduced/state.settings.dailyNew*100):100;$("view-study").innerHTML=`<div class="section-head"><div><div class="eyebrow">TODAY'S PLAN</div><h1 class="page-title">Words</h1></div><button class="btn flat" id="speakPlan" type="button">${state.settings.autoSpeak?'语音已开':'语音已关'}</button></div><div class="plan"><div class="plan-cell"><div class="k">今日新词</div><div class="v">${introduced}<small>/ ${state.settings.dailyNew}</small></div></div><div class="plan-cell"><div class="k">待复习</div><div class="v">${due}<small>词</small></div></div></div><div class="progress"><div class="progress-head"><span>新词计划</span><span>${Math.round(p)}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div><div id="study-card"></div>`;$("speakPlan").onclick=()=>{state.settings.autoSpeak=!state.settings.autoSpeak;save();renderStudy()};}
function renderStudyEmpty(){renderStudy();$("study-card").innerHTML=`<div class="finish"><div class="icon">✓</div><h2>今日计划已清空</h2><p>没有新的待复习项目。继续累积记忆阶段，明天会自动生成下一轮复习。</p><div class="actions"><button class="btn ghost" id="extraBtn" type="button">再学一组</button><button class="btn primary" id="statsBtn" type="button">查看统计</button></div></div>`;$("extraBtn").onclick=()=>start(true);$("statsBtn").onclick=()=>showView('stats')}
function currentData(){return session&&session.queue.length?MAP[session.queue[0].w]:null}
function currentRec(){const d=currentData();return d?userRec(d.w):null}
async function renderCard(){if(!session||!session.queue.length){finish();return}renderStudy();const d=currentData(),r=currentRec(),item=session.queue[0];const currentStage=item.stage;const ph=currentStage==='meaning'?'英译汉':'汉译英';const personal=personalLevel(d,r);let example='';let phon='';try{const info=await dictionaryInfo(d.w);phon=info.phonetic||'';example=info.example||'';if(example)example=cloze(example,d.w)}catch(e){}if(!example&&d.context){example='<span class="source-note">可参考中文语境：'+escapeHtml(d.context)+'</span>'}
$("study-card").innerHTML=`<div class="card"><div class="card-top"><div class="pills"><span class="pill">${ph}</span><span class="pill dim">记忆难度 Lv.${personal}</span></div><span class="phonetic">${session.done}/${session.total}</span><button class="btn flat" id="audioBtn" type="button">听发音</button></div><div class="word">${escapeHtml(d.w)}</div><div class="pos">${escapeHtml(posCN(d.pos))} ${phon?'<span class="phonetic">'+escapeHtml(phon)+'</span>':''}</div>${currentStage==='meaning'?`<div class="muted">先不要看中文。只凭英文单词回忆它的核心含义。</div><input id="answer" class="input" placeholder="输入中文释义" autocomplete="off">`:`<div class="meaning">${escapeHtml(d.zh)}<span class="sub">从中文含义中主动提取英文词形</span></div><div class="example">${example||'正在获取语境例句……'}</div><input id="answer" class="input" placeholder="输入英文单词" autocomplete="off" spellcheck="false">`}<div class="answer-tools"><button class="btn flat" id="hintBtn" type="button">提示</button></div><div id="feedback" class="feedback"></div><div class="actions"><button class="btn ghost" id="failBtn" type="button">忘记</button><button class="btn primary" id="submitBtn" type="button">提交</button><button class="btn primary hidden" id="nextBtn" type="button">继续</button></div></div>`;
$('audioBtn').onclick=()=>speak(d.w);$('hintBtn').onclick=()=>hint();$('failBtn').onclick=()=>submit(true);$('submitBtn').onclick=()=>submit(false);$('nextBtn').onclick=next;questionStarted=performance.now();const input=$('answer');input.focus();input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit(false)}});if(state.settings.autoSpeak) setTimeout(()=>speak(d.w),120)}
function posCN(pos){return ({noun:'名词',verb:'动词',adjective:'形容词',adverb:'副词',preposition:'介词',pronoun:'代词',conjunction:'连词',number:'数词',misc:'其他'})[(pos||'').toLowerCase()]||''}
function cloze(s,w){const re=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');return escapeHtml(s).replace(re,'<span class="blank">______</span>')}
async function dictionaryInfo(w){if(audioCache[w]&&audioCache[w].fetched)return audioCache[w];try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));if(!r.ok)throw new Error('dictionary');const j=await r.json();let phon=(j[0]?.phonetics||[]).find(x=>/uk|gb|british/i.test(x.text||''))||j[0]?.phonetics?.find(x=>x.audio)||j[0]?.phonetics?.[0]||{};let ex='';(j[0]?.meanings||[]).some(m=>(m.definitions||[]).some(def=>{if(def.example){ex=def.example;return true}return false}));audioCache[w]={fetched:true,phonetic:phon.text||'',audio:phon.audio||'',example:ex};return audioCache[w]}catch(e){audioCache[w]={fetched:true,phonetic:'',audio:'',example:''};return audioCache[w]}}
async function speak(w){try{const info=await dictionaryInfo(w);if(info.audio){const a=new Audio(info.audio);await a.play();return}}catch(e){}if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=state.settings.speechRate;speechSynthesis.speak(u)}}
function hint(){const d=currentData(),r=currentRec();if(!d||!session)return;r.hints=(r.hints||0)+1;save();const fb=$('feedback');if(currentItem().stage==='meaning'){fb.className='feedback';fb.innerHTML='提示：'+escapeHtml(d.zh.split(/[；;，,、]/)[0]||'先回忆最常见义项。')}else{fb.className='feedback';fb.innerHTML='提示：<strong>'+escapeHtml(d.w[0])+'</strong> 开头，共 '+d.w.length+' 个字母。'} }
function currentItem(){return session.queue[0]}
function normalizeZh(s){return String(s||'').toLowerCase().replace(/[\s，。,；;、/|“”"'()（）\[\]{}]/g,'')}
function checkMeaning(input,expected){const a=normalizeZh(input), parts=expected.split(/[；;，,、/|]/).map(normalizeZh).filter(x=>x.length>=2);return a.length>=2&&parts.some(p=>a===p||a.includes(p)||p.includes(a))}
function submit(forcedFail){if(!session||!session.queue.length)return;const d=currentData(),r=currentRec(),item=currentItem();const val=forcedFail?'':($('answer')?.value||'').trim();if(!forcedFail&&!val){$('answer').focus();return}const elapsed=Math.max(0,performance.now()-questionStarted);r.seen=(r.seen||0)+1;r.responseMs=(r.responseMs||0)+elapsed;state.totalAnswers++;let ok=false;if(item.stage==='meaning')ok=!forcedFail&&checkMeaning(val,d.zh);else ok=!forcedFail&&val.toLowerCase().replace(/\s+/g,'')===d.w.toLowerCase();if(ok){state.totalCorrect++;session.sessionCorrect++;r.correct=(r.correct||0)+1;r.streak=(r.streak||0)+1;if(item.stage==='meaning'){r.meaningCorrect=(r.meaningCorrect||0)+1;item.stage='production';session.queue.push(session.queue.shift());phase='feedback'}else{r.productionCorrect=(r.productionCorrect||0)+1;r.stage=Math.min(MAX_STAGE,(r.stage||0)+1);r.dueAt=Date.now()+EBBINGHAUS[r.stage];session.done++;session.queue.shift();phase='feedback'}}else{session.sessionWrong++;r.wrong=(r.wrong||0)+1;r.streak=0;if(item.stage==='meaning')r.meaningWrong=(r.meaningWrong||0)+1;else r.productionWrong=(r.productionWrong||0)+1;r.stage=Math.max(0,(r.stage||0)-1);r.dueAt=Date.now()+EBBINGHAUS[0];session.queue.shift();session.queue.push(Object.assign({},item,{stage:item.stage}));phase='feedback'}state.totalSeconds+=(elapsed/1000);if(ok&&currentStage==='production')markDay(true);save();showFeedback(ok,d,item,currentStage);}
function showFeedback(ok,d,item,currentStage){$('answer').disabled=true;$('submitBtn').classList.add('hidden');$('failBtn').classList.add('hidden');$('hintBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');const fb=$('feedback');fb.className='feedback '+(ok?'ok':'bad');if(currentStage==='meaning'){fb.innerHTML=ok?'✓ 核心词义正确。下一步进入语境产出。':'✗ 先记住核心义项：'+escapeHtml(d.zh)}else{fb.innerHTML=ok?'✓ 语境产出正确，已进入下一记忆阶段。':'✗ 正确答案：<strong>'+escapeHtml(d.w)+'</strong>'} }
function next(){if(!session)return;if(session.queue.length===0){finish();return}renderCard()}
function markDay(ok){const t=today();if(!state.days[t])state.days[t]={answers:0,correct:0,done:false};state.days[t].answers++;if(ok)state.days[t].correct++;if(state.days[t].correct>=5){state.days[t].done=true;updateStreak()}}
function updateStreak(){const t=today(),s=state.streak;if(s.last===t)return;if(s.last&&addDays(s.last,1)===t)s.count++;else s.count=1;s.last=t}
function finish(){const done=session?session.done:0;session=null;save();renderStreak();renderStudy();const d=$('study-card');if(!d)return;d.innerHTML=`<div class="finish"><div class="icon">✓</div><h2>本轮完成</h2><p>完成 ${done} 个完整记忆闭环。正确 ${state.totalCorrect.toLocaleString()} / ${state.totalAnswers.toLocaleString()} 次。</p><div class="actions"><button class="btn ghost" id="extraBtn" type="button">再学一组</button><button class="btn primary" id="statsBtn" type="button">统计</button></div></div>`;$('extraBtn').onclick=()=>start(true);$('statsBtn').onclick=()=>showView('stats')}
function renderStreak(){$('streakEl').textContent='连续 '+(state.streak.count||0)+' 天'}
function showView(n){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$('view-'+n).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===n));if(n==='stats')renderStats();if(n==='settings')renderSettings();window.scrollTo(0,0)}
function accuracy(){return state.totalAnswers?Math.round(state.totalCorrect/state.totalAnswers*100):0}
function renderStats(){const learned=Object.keys(state.words).length;const due=getDue().length;const dist=Array(MAX_STAGE+1).fill(0);let mastered=0,weak=[];Object.keys(state.words).forEach(w=>{const r=state.words[w];const s=Math.min(MAX_STAGE,r.stage||0);dist[s]++;if(s>=6)mastered++;const wrong=(r.meaningWrong||0)+(r.productionWrong||0);if(wrong)weak.push({w,wrong,lv:personalLevel(MAP[w]||{baseLv:5},r)})});weak.sort((a,b)=>b.wrong-a.wrong);const t=today();let week='';for(let i=6;i>=0;i--){const ds=addDays(t,-i),r=state.days[ds],on=r&&r.done;week+=`<div class="day ${on?'on':''}"><div class="d">${ds.slice(5)}</div><div class="v">${on?'✓':(r?r.correct:'·')}</div></div>`}let bars='';const labels=['新建','10m','1d','2d','4d','7d','15d','30d','60d','120d','1y'];const mx=Math.max(1,...dist);dist.forEach((n,i)=>bars+=`<div class="dist"><span class="lab">${labels[i]}</span><span class="track"><i style="width:${n/mx*100}%"></i></span><span class="num">${n}</span></div>`);const weakHtml=weak.slice(0,8).map(x=>`<div class="weak-row"><div><div class="weak-word">${escapeHtml(x.w)}</div><div class="weak-meta">记忆难度 Lv.${x.lv}</div></div><div class="weak-meta">错 ${x.wrong} 次</div></div>`).join('')||'<div class="tiny">暂时没有高频错词。</div>';$('view-stats').innerHTML=`<div class="section-head"><div><div class="eyebrow">MEMORY PROFILE</div><h1 class="page-title">统计</h1></div></div><div class="grid2"><div class="stat"><div class="k">连续打卡</div><div class="v">${state.streak.count||0}<small>天</small></div></div><div class="stat"><div class="k">已进入记忆库</div><div class="v">${learned.toLocaleString()}<small>词</small></div></div><div class="stat"><div class="k">总正确率</div><div class="v">${accuracy()}<small>%</small></div></div><div class="stat"><div class="k">待复习</div><div class="v">${due.toLocaleString()}<small>词</small></div></div></div><div class="panel"><div class="panel-title">最近 7 天</div><div class="week">${week}</div></div><div class="panel"><div class="panel-title">记忆阶段</div><div class="tiny">阶段越高，下一次复习间隔越长；答错会回落到短间隔强化。</div>${bars}</div><div class="panel"><div class="panel-title">高频错误词</div>${weakHtml}</div>`}
function renderSettings(){const s=state.settings;const difficulty=s.difficulty;const choices=[['adaptive','自适应'],['easy','基础'],['mid','进阶'],['hard','困难'],['extreme','挑战']];$('view-settings').innerHTML=`<div class="section-head"><div><div class="eyebrow">SYSTEM</div><h1 class="page-title">设置</h1></div></div><div class="panel"><div class="panel-title">新词记忆难度</div><p class="muted">难度依据词汇学习者数据的知识难度，并结合你的错误、提示和连续正确表现动态修正。不会按首字母或数组顺序选词。</p><div class="choice-grid">${choices.map(c=>`<button class="choice ${difficulty===c[0]?'on':''}" data-diff="${c[0]}" type="button">${c[1]}</button>`).join('')}</div></div><div class="panel"><div class="panel-title">每日新词</div><div class="range-row"><input id="dailyRange" class="range" type="range" min="50" max="300" step="10" value="${s.dailyNew}"><div id="dailyVal" class="range-val">${s.dailyNew} 词</div></div><div class="tiny">默认 300 词。每个新词包含“英译汉 + 语境汉译英”两个主动回忆阶段。</div></div><div class="panel"><div class="panel-title">每日复习上限</div><div class="range-row"><input id="reviewRange" class="range" type="range" min="50" max="500" step="25" value="${s.reviewLimit}"><div id="reviewVal" class="range-val">${s.reviewLimit} 词</div></div></div><div class="panel"><div class="panel-title">发音</div><div class="toggle"><span>自动朗读当前单词</span><input id="autoSpeak" class="switch" type="checkbox" ${s.autoSpeak?'checked':''}></div><div class="range-row"><span class="tiny">语速</span><input id="rateRange" class="range" type="range" min="0.65" max="1.15" step="0.05" value="${s.speechRate}"><div id="rateVal" class="range-val">${s.speechRate.toFixed(2)}</div></div></div><div class="panel"><div class="panel-title">数据管理</div><div class="actions"><button class="btn ghost" id="exportBtn">导出</button><button class="btn ghost" id="importBtn">导入</button><button class="btn danger" id="resetBtn">重置</button></div><input id="fileInput" type="file" accept="application/json,.json" class="hidden"></div><div class="panel"><div class="panel-title">词库来源</div><div class="source-box">主词库：British Council BEA 2026 Shared Task / KVL 中文学习者数据。数据按学习者词汇掌握难度排序，并包含词性、中文提示与 GLMM difficulty score。联网后自动加载 6,768 个词项；离线时使用内置核心词库。</div></div>`;
 document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{state.settings.difficulty=b.dataset.diff;save();renderSettings();toast('记忆难度已更新')});$('dailyRange').oninput=e=>{state.settings.dailyNew=+e.target.value;$('dailyVal').textContent=e.target.value+' 词';save()};$('reviewRange').oninput=e=>{state.settings.reviewLimit=+e.target.value;$('reviewVal').textContent=e.target.value+' 词';save()};$('autoSpeak').onchange=e=>{state.settings.autoSpeak=e.target.checked;save()};$('rateRange').oninput=e=>{state.settings.speechRate=+e.target.value;$('rateVal').textContent=Number(e.target.value).toFixed(2);save()};$('exportBtn').onclick=exportData;$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=importData;$('resetBtn').onclick=resetData}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='words-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('备份已导出')}
function importData(e){const f=e.target.files?.[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{state=normalize(JSON.parse(fr.result));save();renderAll();toast('备份导入成功')}catch(err){toast('文件格式错误')}};fr.readAsText(f);e.target.value=''}
function resetData(){if(!confirm('确定清空全部学习记录？词库不会删除。'))return;state=JSON.parse(JSON.stringify(DEFAULT));save();session=null;renderAll();toast('学习记录已清空')}
function renderAll(){renderStreak();showView('study');if(!session)start(false)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showView(b.dataset.view));
async function boot(){try{renderStudyEmpty();renderStreak();await loadRemote()}catch(e){showError(e)}}
boot();
})();

</script>
