<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="description" content="Words · 基于主动回忆与艾宾浩斯式间隔重复的高强度词汇学习系统">
  <link rel="manifest" href="./manifest.json">
  <title>Words</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Words</div>
      <div class="streak" id="streakEl">连续 0 天</div>
    </header>

    <main class="main">
      <section id="view-study" class="view">
        <div class="hero">
          <div class="hero-copy">
            <div class="eyebrow">TODAY'S MEMORY PLAN</div>
            <h1>记忆，不是浏览。</h1>
            <p id="planDesc">先做英译汉回忆，再做语境填空的汉译英主动回忆。到期词优先，新词默认每天 300 个。</p>
          </div>
          <div id="checkinBadge" class="checkin-badge off">未打卡</div>
        </div>

        <div class="plan-grid">
          <div class="plan-item"><div class="k">今日新词</div><div class="v" id="planNew">0<small>/ 300</small></div></div>
          <div class="plan-item"><div class="k">今日到期复习</div><div class="v" id="planReview">0</div></div>
          <div class="plan-item"><div class="k">记忆难度</div><div class="v" id="planLevel">Lv.1</div></div>
        </div>

        <div class="bar-wrap">
          <div class="bar-head"><span id="barLeft">正在加载词库…</span><span id="barRight"></span></div>
          <div class="bar"><i id="barFill"></i></div>
        </div>

        <div id="loadingArea" class="loading-card">
          <div class="spinner"></div>
          <div><strong>正在建立词库</strong><p id="loadingText">加载研究型中文学习者词汇数据…</p></div>
        </div>

        <div id="cardArea" class="hidden">
          <div class="card">
            <div class="card-head">
              <div class="pills">
                <span class="pill" id="pillMode">新词</span>
                <span class="pill stage" id="pillStep">① 英译汉</span>
                <span class="pill dim" id="pillLv">记忆难度 Lv.1</span>
              </div>
              <button class="speak" id="btnSpeak" type="button" title="朗读" aria-label="朗读">🔊</button>
            </div>

            <div id="stage1" class="stage-view">
              <div class="word" id="word"></div>
              <div class="pronounce"><span id="ipa">/…/</span><span id="pos">—</span><span id="wordFreq">—</span></div>
              <div class="recall-rule">先在脑中给出中文释义，再输入。不要急着看答案。</div>
              <input id="meaningAnswer" class="answer" type="text" autocomplete="off" placeholder="输入中文释义，按 Enter 提交">
            </div>

            <div id="stage2" class="stage-view hidden">
              <div class="meaning" id="meaning"></div>
              <div class="context-label">语境填空 · 汉译英</div>
              <div class="sentence" id="sentence">正在获取例句…</div>
              <div class="cn-context" id="cnContext"></div>
              <div class="clue" id="clue"></div>
              <input id="wordAnswer" class="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文单词，按 Enter 提交">
            </div>

            <div class="hint" id="hint"></div>
            <div class="fb" id="fb"></div>
            <div class="btns">
              <button class="btn ghost" id="btnHint" type="button">提示</button>
              <button class="btn ghost hidden" id="btnReveal" type="button">查看答案</button>
              <button class="btn primary" id="btnSubmit" type="button">提交</button>
              <button class="btn primary hidden" id="btnNext" type="button">下一词</button>
            </div>
          </div>
        </div>

        <div id="finishArea" class="finish hidden">
          <div class="finish-icon">✓</div>
          <h2 id="finishTitle">本轮完成</h2>
          <p id="finishDesc"></p>
          <div class="btns finish-btns">
            <button class="btn ghost" id="btnExtra" type="button">继续 300 词</button>
            <button class="btn primary" id="btnStats" type="button">查看统计</button>
          </div>
        </div>
      </section>

      <section id="view-stats" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
    </main>

    <nav class="bottomnav">
      <button class="tab active" data-view="study" type="button"><b>◈</b>学习</button>
      <button class="tab" data-view="stats" type="button"><b>◍</b>统计</button>
      <button class="tab" data-view="settings" type="button"><b>⚙</b>设置</button>
    </nav>
  </div>
  <div class="toast" id="toast"></div>
  <div id="err" class="err"></div>

  <script src="./seed-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
